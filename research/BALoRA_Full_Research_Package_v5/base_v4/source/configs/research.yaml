# Declared Fold-1 20-epoch preset. Use the notebook for measured 30-hour orchestration.
experiment:
  name: balora_btcv_fold0
  version: 0.1.0
  seed: 42
  output_dir: /kaggle/working/balora_outputs/btcv_fold0
  device: cuda
  mode: research
data:
  dataset: btcv
  root_dir: /kaggle/input/datasets/aritrikghosh/btcv-abdominal-ct/RawData/Training
  train_split: data/splits/btcv_train.json
  val_split: data/splits/btcv_val.json
  test_split: data/splits/btcv_test.json
  image_size: 1024
  sam2_image_size: 1024
  num_classes: 14
  clip_len: 1
  ct_window:
  - -175.0
  - 250.0
  n_folds: 5
  fold: 0
  split_seed: 42
  val_fraction: 0.15
sam2:
  model_cfg: configs/sam2.1/sam2.1_hiera_b+.yaml
  checkpoint: /kaggle/working/checkpoints/sam2.1_hiera_base_plus.pt
  repo: https://github.com/facebookresearch/sam2.git
  git_ref: 2b90b9f5ceec907a1c18123530e92e794ad901a4
  freeze_backbone: true
lora:
  encoder_target_modules:
  - attn.qkv
  - attn.proj
  - mlp.layers.0
  - mlp.layers.1
  target_modules:
  - transformer.layers.
  - transformer.final_attn_token_to_image.
  rank_bank:
  - 4
  - 8
  - 16
  alpha: 16.0
  dropout: 0.05
  attribution_gamma: 4.0
  learned_prior_weight: 0.2
bayesian:
  enabled: true
  posterior_scope: sam_mask_decoder_only
  encoder_scope: point_estimate_lora
  prior_std: 1.0
  init_posterior_std: 0.05
  k_train: 2
  k_infer: 4
confidence:
  region_min_area: 25
  entropy_eps: 1.0e-08
refinement:
  enabled: true
  confidence_threshold: 0.85
  max_iters: 3
  crop_padding: 16
  min_region_area: 25
loss:
  dice_weight: 1.0
  bce_weight: 1.0
  lambda_kl: 0.0001
  lambda_cal: 0.1
  lambda_rank: 0.01
training:
  batch_size: 1
  num_epochs: 20
  lr: 0.0001
  weight_decay: 1.0e-05
  grad_clip_norm: 1.0
  amp: true
  num_workers: 0
  checkpoint_every: 5
  early_stopping_patience: 6
  val_every: 1
  min_epochs: 8
  checkpoint_seconds: 300
logging:
  log_every_n_steps: 100

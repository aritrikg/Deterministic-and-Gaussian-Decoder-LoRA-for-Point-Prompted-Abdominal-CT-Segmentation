   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="8.64" y="20.627027" transform="rotate(-0 8.64 20.627027)">Implemented BALoRA pipeline</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4b5563" x="8.64" y="37.408865" transform="rotate(-0 8.64 37.408865)">Code-derived schematic; no clinical image or predicted mask is shown.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(95.244398 72.146191)">CT slice</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(31.233719 84.410574)">HU window and 1024 × 1024 resize</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(311.25952 66.014)">SAM2.1 image encoder</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(271.506028 78.278383)">Frozen base + 96 deterministic adapters</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(327.188786 90.542765)">Adapter rank 16</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(55.013867 149.923189)">Ground-truth organ mask</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(27.317875 162.187572)">One uniformly sampled positive point</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(32.658437 174.451955)">Same point at both decoder stages</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(308.837356 149.923189)">Bayesian decoder probe</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(303.432809 162.187572)">2 full-rank draws (rank 16)</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(294.302239 174.451955)">Mean pixel mutual information</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(290.025239 244.620702)">Activation × gradient attribution</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(279.81902 256.885085)">32 gate priors; detached hard choice</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(293.078716 269.149468)">Ranks selected from {4, 8, 16}</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(60.22575 244.620702)">Final Bayesian decoder</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(42.880297 256.885085)">K = 2 training; K = 4 inference</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(44.988227 269.149468)">Fresh draws at selected ranks</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(45.36218 320.138973)">Average sigmoid probabilities</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(46.982406 332.403356)">Binary mask at threshold 0.5</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #15283a" transform="translate(52.364914 344.667738)">Main policy: no refinement</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="374.5206" y="119.827674" transform="rotate(-0 374.5206 119.827674)">image features</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(270.3141 320.756074)">Frozen base and prompt encoder.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(270.3141 333.61913)">Gate gradients: sparsity penalty only.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(270.3141 346.482186)">Calls per prompt: 2 probe + K final.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #4b5563" transform="translate(270.3141 359.345242)">Uncertainty: decoder factors only.</text>
   </g>
  </g>
